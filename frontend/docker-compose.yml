services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_mgmt_frontend
    restart: unless-stopped
    env_file:
      - ./.env.local
    environment:
      DJANGO_API_URL: ${DJANGO_API_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
