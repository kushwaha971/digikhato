services:
  db:
    image: postgres:16-alpine
    container_name: money_mgmt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money-mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-money-mgmt}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money_mgmt_backend
    restart: unless-stopped
    env_file:
      - ./.env
    entrypoint: ["sh", "/app/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    ports:
      - "8001:8000"

volumes:
  pg_data:
